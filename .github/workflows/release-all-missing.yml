name: Release All Missing
# Registry: amd64 arm64 armhf armv6 armv7 i386 ppc64le s390x riscv64 loong64 win64 win-arm64 win32 mac-amd64 mac-arm64 freebsd-x64
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing main-HASH release, e.g. main-79267331504d'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: mongosh-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.gaps.outputs.targets }}
      count: ${{ steps.gaps.outputs.count }}
      node-version: ${{ steps.gaps.outputs.node-version }}
    steps:
      - uses: actions/checkout@v7
        with: { path: _patches }
      - name: Check dependency risk indicators before release work
        shell: bash
        run: python3 _patches/releases/remote-release.py --audit

      - id: gaps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^main-[0-9a-f]{12}$ ]] || { echo 'Expected main- plus 12 hex characters' >&2; exit 2; }
          gh release view "$VERSION" --json assets --jq '.assets[].name' > existing
          gh api repos/wekan/node-patches/releases/latest > node-release.json
          node _patches/releases/plan-targets.mjs node-release.json existing
  bundle:
    needs: audit
    if: ${{ needs.audit.outputs.count != '0' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { path: _patches }
      - env:
          REQUESTED_SOURCE: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash _patches/releases/prepare-source.sh _patches "$REQUESTED_SOURCE"
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm install --global npm@12.0.2
      - name: Build with source, artifact and runtime telemetry checks
        run: bash _patches/releases/build-bundle.sh
      - uses: actions/upload-artifact@v7
        with:
          name: mongosh-missing-bundle
          path: out/
          if-no-files-found: error
  packages:
    needs: [audit, bundle]
    if: ${{ needs.audit.outputs.count != '0' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.audit.outputs.targets) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { path: _patches }
      - uses: actions/download-artifact@v8
        with:
          name: mongosh-missing-bundle
          path: bundle
      - id: package
        env:
          PATCHES_ROOT: _patches
          NODE_PATCHES_VERSION: ${{ needs.audit.outputs.node-version }}
        run: bash _patches/releases/package-target.sh "${{ matrix.target }}" bundle/mongosh.js
      - uses: actions/upload-artifact@v7
        with:
          name: missing-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
      # The audit job confirmed the release exists; attach this target's files
      # now instead of waiting for every other target to finish.
      # Runs even when the workflow is cancelled, so a finished package is
      # never lost; a package that did not build is never attached.
      - name: Attach this target's package and checksum to the release
        if: ${{ always() && steps.package.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(out/*)
          bash _patches/releases/upload-release-assets.sh "$VERSION" "${files[@]}"
  # Packages are already attached by the jobs that built them. This job only
  # checks that every repaired package and checksum is on the release.
  publish:
    needs: [audit, packages]
    if: ${{ always() && needs.audit.result == 'success' && needs.audit.outputs.count != '0' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          PACKAGES_RESULT: ${{ needs.packages.result }}
          TARGETS: ${{ needs.audit.outputs.targets }}
        run: |
          set -euo pipefail
          mkdir verify && cd verify
          gh release view "$VERSION" --json assets --jq '.assets[].name' > existing
          count=0
          missing=()
          for target in $(jq -r '.[]' <<<"$TARGETS"); do
            ext=tgz; [[ "$target" == win* ]] && ext=zip
            asset="mongosh-$target.$ext"
            # A cancelled or failed target is reported, not hidden; the
            # finished ones were already attached by their own jobs.
            if ! grep -qxF "$asset" existing || ! grep -qxF "$asset.sha256sum" existing; then
              missing+=("$target")
              continue
            fi
            gh release download "$VERSION" --pattern "$asset" --pattern "$asset.sha256sum"
            sha256sum -c "$asset.sha256sum"
            rm -f "$asset"
            count=$((count + 1))
          done
          [ "$count" -gt 0 ] || [ "$PACKAGES_RESULT" != success ] || { echo '::error::missing build emitted no assets'; exit 1; }
          echo "Verified $count package(s) on $VERSION."
          if [ "${#missing[@]}" -gt 0 ]; then
            # Per-target results are not visible here; only a target whose
            # packages job succeeded attaches files. If every packages job
            # succeeded, a missing file is a real fault. Otherwise the run was
            # cancelled or a target failed (already shown by that job), and
            # the absent targets are reported as not built.
            if [ "$PACKAGES_RESULT" = success ]; then
              echo "::error::packages succeeded but not attached: ${missing[*]}"
              exit 1
            fi
            echo "::warning::not built in this run ($PACKAGES_RESULT): ${missing[*]}; rerun this workflow to add them"
          fi
          echo "Repaired ${{ needs.audit.outputs.count }} target package(s)."
