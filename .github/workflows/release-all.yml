name: Release All
# Registry: amd64 arm64 armhf armv6 armv7 i386 ppc64le s390x riscv64 loong64 win64 win-arm64 win32 mac-amd64 mac-arm64 freebsd-x64

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Source (empty = newest main; or main- plus 12-character commit hash)'
        required: false
        type: string
      publish:
        description: 'Attach packages to the GitHub Release'
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: mongosh-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      node-version: ${{ steps.meta.outputs.node-version }}
      targets: ${{ steps.meta.outputs.targets }}
      count: ${{ steps.meta.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with: { path: _patches }
      - name: Check dependency risk indicators before release work
        shell: bash
        run: python3 _patches/releases/remote-release.py --audit

      - name: Fetch exact upstream main commit and apply verified patches
        env:
          REQUESTED_SOURCE: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash _patches/releases/prepare-source.sh _patches "$REQUESTED_SOURCE"
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm install --global npm@12.0.2
      - name: Build with source, artifact and runtime telemetry checks
        run: bash _patches/releases/build-bundle.sh
      - id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/wekan/node-patches/releases/latest > node-release.json
          node _patches/releases/plan-targets.mjs node-release.json
          echo "version=$MONGOSH_REF" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: mongosh-bundle
          path: out/
          if-no-files-found: error
      # This job creates the release, so every package job can attach its own
      # files the moment it has built and checked them.
      - name: Create or update the release and attach the source manifest
        if: ${{ inputs.publish && steps.meta.outputs.count != '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          printf 'mongosh %s packages using prebuilt wekan/node-patches Node.js runtimes.\n' "$VERSION" > notes.md
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --notes-file notes.md
          else
            gh release create "$VERSION" --title "$VERSION" --notes-file notes.md
          fi
          bash _patches/releases/upload-release-assets.sh "$VERSION" out/mongosh-source.json out/mongosh.js.sha256sum

  packages:
    needs: bundle
    if: ${{ needs.bundle.outputs.count != '0' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.bundle.outputs.targets) }}
    steps:
      - uses: actions/checkout@v7
        with: { path: _patches }
      - uses: actions/download-artifact@v8
        with:
          name: mongosh-bundle
          path: bundle
      - name: Package mongosh with the matching node-patches release binary
        env:
          PATCHES_ROOT: _patches
          NODE_PATCHES_VERSION: ${{ needs.bundle.outputs.node-version }}
        run: bash _patches/releases/package-target.sh "${{ matrix.target }}" bundle/mongosh.js
      - uses: actions/upload-artifact@v7
        with:
          name: mongosh-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
      - name: Attach this target's package and checksum to the release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.bundle.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(out/mongosh-*.tgz out/mongosh-*.zip out/*.sha256sum)
          bash _patches/releases/upload-release-assets.sh "$VERSION" "${files[@]}"

  # Packages are already attached by the jobs that built them. This job only
  # checks that the release is complete and that every package matches its
  # published checksum, so a partial rerun is verified against the release.
  publish:
    if: ${{ inputs.publish && needs.bundle.outputs.count != '0' }}
    needs: [bundle, packages]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every package and checksum on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.bundle.outputs.version }}
          TARGETS: ${{ needs.bundle.outputs.targets }}
        run: |
          set -euo pipefail
          mkdir verify && cd verify
          gh release download "$VERSION" --pattern mongosh-source.json --pattern mongosh.js.sha256sum
          [ -s mongosh-source.json ] && [ -s mongosh.js.sha256sum ] || { echo '::error::source manifest or bundle checksum missing'; exit 1; }
          count=0
          for target in $(jq -r '.[]' <<<"$TARGETS"); do
            ext=tgz; [[ "$target" == win* ]] && ext=zip
            asset="mongosh-$target.$ext"
            gh release download "$VERSION" --pattern "$asset" --pattern "$asset.sha256sum"
            sha256sum -c "$asset.sha256sum"
            rm -f "$asset"
            count=$((count + 1))
          done
          [ "$count" -gt 0 ] || { echo '::error::no packages'; exit 1; }
          echo "Verified $count package(s) on $VERSION."
